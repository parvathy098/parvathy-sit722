name: Testing Branch CI Pipeline

on:
  push:
    branches:
      - testing

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Add PostgreSQL as a service container
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Test Customer Service
      - name: Install Customer Service Dependencies
        run: |
          cd backend/customer_service
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Customer Service Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customers
        run: |
          cd backend/customer_service
          pytest --cov=. --cov-report=xml --cov-report=term
        continue-on-error: false

      # Test Order Service
      - name: Install Order Service Dependencies
        run: |
          cd backend/order_service
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Order Service Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders
        run: |
          cd backend/order_service
          pytest --cov=. --cov-report=xml --cov-report=term
        continue-on-error: false

      # Test Product Service
      - name: Install Product Service Dependencies
        run: |
          cd backend/product_service
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Product Service Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/products
        run: |
          cd backend/product_service
          pytest --cov=. --cov-report=xml --cov-report=term
        continue-on-error: false

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      # Build and Push Customer Service
      - name: Build Customer Service Image
        run: |
          cd backend/customer_service
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:latest

      - name: Push Customer Service Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:latest

      # Build and Push Order Service
      - name: Build Order Service Image
        run: |
          cd backend/order_service
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest

      - name: Push Order Service Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest

      # Build and Push Product Service
      - name: Build Product Service Image
        run: |
          cd backend/product_service
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest

      - name: Push Product Service Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest

      # Build and Push Frontend
      - name: Build Frontend Image
        run: |
          cd frontend
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Trigger Staging Deployment
        run: |
          echo "All tests passed and images pushed successfully"
          echo "Triggering staging deployment workflow"
        
      - name: Repository Dispatch for Staging
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-staging
          client-payload: '{"sha": "${{ github.sha }}"}'