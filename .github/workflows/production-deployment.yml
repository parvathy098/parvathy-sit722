name: Deploy to Production Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy-production:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.PRODUCTION_CLUSTER_NAME }} --overwrite-existing

      - name: Connect ACR to AKS
        run: |
          az aks update -n ${{ secrets.PRODUCTION_CLUSTER_NAME }} -g ${{ secrets.RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Create Production Namespace
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR Secret in Kubernetes
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Image Tags in K8s Manifests
        run: |
          # Update customer service
          sed -i "s|image: .*customer-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:latest|g" k8s/customer-deployment.yaml
          
          # Update order service
          sed -i "s|image: .*order-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest|g" k8s/order-deployment.yaml
          
          # Update product service
          sed -i "s|image: .*product-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest|g" k8s/product-deployment.yaml
          
          # Update frontend
          sed -i "s|image: .*frontend.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest|g" k8s/frontend-deployment.yaml

      - name: Deploy to Production
        run: |
          kubectl apply -f k8s/ -n production

      - name: Wait for Deployments to be Ready
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment --all -n production

      - name: Get Service URLs
        run: |
          echo "Production Environment Deployed Successfully!"
          echo "Waiting for external IPs to be assigned..."
          sleep 30
          kubectl get services -n production

      - name: Display Deployment Status
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n production
          echo "=== Services ==="
          kubectl get svc -n production
          echo "=== Deployments ==="
          kubectl get deployments -n production
          echo "=== Production deployment completed successfully ==="

      - name: Create Deployment Summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: ${{ secrets.PRODUCTION_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY