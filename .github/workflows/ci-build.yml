name: CI Build and Push

on:
  push:
    branches: [ testing ]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [customer_service, order_service, product_service, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Run tests
      run: |
        cd backend/${{ matrix.service }} || cd ${{ matrix.service }}
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
          pytest || true
        elif [ -f package.json ]; then
          npm ci
          npm test || true
        fi

    - name: Build and Push
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t $ACR_LOGIN_SERVER/${{ matrix.service }}:$IMAGE_TAG ./backend/${{ matrix.service }} || docker build -t $ACR_LOGIN_SERVER/${{ matrix.service }}:$IMAGE_TAG ./frontend
        docker push $ACR_LOGIN_SERVER/${{ matrix.service }}:$IMAGE_TAG
