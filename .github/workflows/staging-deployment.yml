name: Deploy to Staging Environment

on:
  repository_dispatch:
    types: [deploy-staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.STAGING_CLUSTER_NAME }} --overwrite-existing

      - name: Connect ACR to AKS
        run: |
          az aks update -n ${{ secrets.STAGING_CLUSTER_NAME }} -g ${{ secrets.RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Create Staging Namespace
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR Secret in Kubernetes
        run: |
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Image Tags in K8s Manifests
        run: |
          # Update customer service
          sed -i "s|image: .*customer-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:latest|g" k8s/customer-deployment.yaml
          
          # Update order service
          sed -i "s|image: .*order-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest|g" k8s/order-deployment.yaml
          
          # Update product service
          sed -i "s|image: .*product-service.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest|g" k8s/product-deployment.yaml
          
          # Update frontend
          sed -i "s|image: .*frontend.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest|g" k8s/frontend-deployment.yaml

      - name: Deploy to Staging
        run: |
          kubectl apply -f k8s/ -n staging

      - name: Wait for Deployments to be Ready
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment --all -n staging

      - name: Get Service URLs
        run: |
          echo "Staging Environment Deployed Successfully!"
          echo "Waiting for external IPs to be assigned..."
          sleep 30
          kubectl get services -n staging

      - name: Display Deployment Status
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n staging
          echo "=== Services ==="
          kubectl get svc -n staging
          echo "=== Deployments ==="
          kubectl get deployments -n staging

      - name: Staging Environment Info
        run: |
          echo "Staging environment is now ready for testing"
          echo "Please perform manual or automated acceptance testing"
          echo "After testing, you can destroy this environment or merge to main for production deployment"

  cleanup-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.STAGING_CLUSTER_NAME }} --overwrite-existing

      - name: Delete Staging Namespace
        run: |
          kubectl delete namespace staging --ignore-not-found=true
          echo "Staging environment destroyed successfully"