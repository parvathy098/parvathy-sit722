name: Staging Deploy

on:
  workflow_run:
    workflows: ["CI Build and Push"]
    types: [completed]
  workflow_dispatch:

jobs:
  staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS Credentials
      run: az aks get-credentials -n ${{ secrets.STAGING_CLUSTER_NAME }} -g ${{ secrets.RESOURCE_GROUP }} --overwrite-existing

    - name: Deploy to Staging
      run: |
        SHA=${{ github.event.workflow_run.head_sha || github.sha }}
        for f in k8s/*.yaml; do
          sed -i "s|<IMAGE_TAG>|$SHA|g" $f
        done
        kubectl apply -f k8s/
        kubectl rollout status deployment/customer-service --timeout=120s || true
